name: Vérification FESTAPP

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester les règles métier
        run: npm test
      - name: Compiler l'application
        run: npm run build
      - name: Préparer un artefact de démonstration
        uses: actions/upload-artifact@v4
        with:
          name: festapp-demo
          path: dist/
          retention-days: 14
