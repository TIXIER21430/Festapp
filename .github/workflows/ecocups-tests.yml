name: FESTAPP écocups checks
on:
  pull_request:
    paths:
      - 'src/lib/ecocups.js'
      - 'tests/ecocups.test.js'
      - '.github/workflows/ecocups-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la logique écocups
        run: node --test tests/ecocups.test.js
