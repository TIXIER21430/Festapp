name: FESTAPP checks (no deployment)

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build Vite app
        run: npm run build
      - name: Verify build output
        run: test -f dist/index.html
      - name: Check public bundle has production gate and no private Drive folder IDs
        run: |
          grep -R -q 'Connexion au comité' dist/assets/
          if grep -R -E -q 'drive\\.google\\.com/drive/folders/[A-Za-z0-9_-]{10,}' dist/; then
            echo 'Private Drive folder URL was bundled into public JavaScript' >&2
            exit 1
          fi
          if grep -R -E -q 'sb_secret_[A-Za-z0-9_-]+|service_role[^A-Za-z]' dist/; then
            echo 'Potential secret/server credential was bundled' >&2
            exit 1
          fi

# Intentionally no Supabase credentials, migrations, deploy, write permissions or artifacts.
