name: FESTAPP checks (no deployment)

on:
  pull_request:
  push:
    branches:
      - 'feat/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build Vite app
        run: npm run build
      - name: Verify build output
        run: test -f dist/index.html

# Intentionally no Supabase credentials, migrations, deploy, write permissions or artifacts.
