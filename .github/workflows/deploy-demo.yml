name: Publier la démonstration FESTAPP

on:
  push:
    branches:
      - feat/github-pages-demo-20261113
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: festapp-demo-pages
  cancel-in-progress: false

jobs:
  publish-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester les règles métier
        run: npm test
      - name: Compiler la démonstration
        run: npm run build
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers pour Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publier la démonstration
        id: deployment
        uses: actions/deploy-pages@v4
